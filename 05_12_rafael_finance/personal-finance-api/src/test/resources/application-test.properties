# ============================================================
# TEST PROFILE — used by all @SpringBootTest integration tests
# ============================================================
# The datasource URL is overridden at runtime by Testcontainers
# via @DynamicPropertySource; these values are safe defaults.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable H2 console (not needed in tests)
spring.h2.console.enabled=false

# JWT config for tests — deterministic secret for token generation
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qdW5pdC10ZXN0cy1taW5pbXVtLTI1NmJpdHM=
app.jwt.expiration-ms=3600000

spring.jackson.serialization.write-dates-as-timestamps=false
